name: teamix
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.3
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  http: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0
flutter:
  uses-material-design: true
  assets:
    - assets/demo/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardStd-Black.otf
          weight: 900
